services:
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    ports:
      - '9092:9092'
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1

  app:
    build:
      context: .
      dockerfile: Kafka/Dockerfile
    container_name: python_kafka
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      - kafka
    volumes:
      - ./Kafka:/app
      - ./Data:/Data

  mongodb:
    image: mongo
    container_name: db
    ports:
      - '27017:27017'

  asp-consumer:
    build:
      context: ./AspConcumer
      dockerfile: Dockerfile
    container_name: asp-consumer-to-mongo
    restart: unless-stopped
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - INPUT_TOPIC=processed-topic
      - MONGO_CONNECTION_STRING=mongodb://mongodb:27017
    depends_on:
      - kafka
      - app
      - mongodb

  mongo-api:
    build:
      context: ./AiFromMongoAPI
      dockerfile: Dockerfile
    container_name: mongo_api_service
    restart: unless-stopped
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Surveys__ConnectionString=mongodb://mongodb:27017
      - Surveys__DatabaseName=my-database
      - Surveys__CollectionName=Surveys
    depends_on:
      - mongodb